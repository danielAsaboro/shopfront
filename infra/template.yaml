AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Shopfront: a public HTTPS endpoint for Ring's signed webhooks (Lambda Function URL) that checks the HMAC and
  queues the event in SQS, a consumer that stores it in a DynamoDB log the app reads (dead-letter queue after
  5 tries), a private S3 bucket for door frames, the HMAC key in Secrets Manager, and a read-only public
  demo of the app over a made-up shop (a second Function URL). See docs/aws.md.

Parameters:
  ShopId:
    Type: String
    Default: shop
    AllowedPattern: "^[a-z0-9-]{1,40}$"
    Description: Partition prefix for this shop's events. Set SHOPFRONT_SHOP_ID to the same value in the app.
  RingDeviceId:
    Type: String
    Default: ""
    Description: The shop doorbell's Ring device ID (webhook data.attributes.source). Empty accepts any device.
  RingAccountId:
    Type: String
    Default: ""
    Description: The owner's Ring Account ID (webhook meta.account_id). Empty accepts any account.
  EventDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: Days a webhook event is kept in DynamoDB before the TTL removes it.
  FrameDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: Days a door frame (a picture of people) is kept in S3 before the lifecycle rule deletes it.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: Days CloudWatch keeps the webhook functions' logs.
  DemoConcurrency:
    Type: Number
    Default: 2
    MinValue: -1
    MaxValue: 10
    Description: >-
      Most public demo requests running at once (reserved concurrency), the cost cap. 0 switches the demo
      off without deleting it. -1 reserves nothing, for accounts whose concurrency limit is too low to
      reserve any (the demo then shares the account's pool, uncapped).
  DemoLogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: Days CloudWatch keeps the public demo's logs.

Conditions:
  CapDemoConcurrency: !Not [!Equals [!Ref DemoConcurrency, -1]]

Resources:
  # The key Ring signs webhooks with (partner onboarding). The template only creates the empty slot; the
  # value is set once after deploy with `aws secretsmanager put-secret-value` (docs/aws.md) and never
  # appears in the template, the parameters or the function's environment. Until then the function
  # answers 503, which Ring retries.
  RingHmacSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shopfront RING_HMAC_KEY for verifying Ring webhook signatures. Set the value after deploy.
      GenerateSecretString:
        SecretStringTemplate: '{"RING_HMAC_KEY": ""}'
        GenerateStringKey: unused
        PasswordLength: 16

  WebhookTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: false # false = encrypted at rest with a DynamoDB-owned key, at no cost

  FramesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-frames
            Status: Enabled
            ExpirationInDays: !Ref FrameDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FramesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FramesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FramesBucket.Arn
              - !Sub "${FramesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---- Ring -> Function URL -> SQS -> consumer -> DynamoDB ----------------------------------------------
  # The Function URL handler only checks and enqueues, so Ring gets its 2xx in milliseconds whatever DynamoDB
  # is doing. A message the consumer can't store is retried; after 5 receives it moves to the dead-letter
  # queue (14 days), where the DlqDepth alarm sees it and `aws sqs start-message-move-task` redrives it.
  WebhookDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600 # 14 days, the most SQS keeps a message

  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600 # 4 days
      VisibilityTimeout: 180 # 6 x the consumer's timeout, as Lambda's SQS event source recommends
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDeadLetterQueue.Arn
        maxReceiveCount: 5

  WebhookQueuesPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WebhookQueue
        - !Ref WebhookDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource:
              - !GetAtt WebhookQueue.Arn
              - !GetAtt WebhookDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/shopfront/${AWS::StackName}/ring-webhook"
      RetentionInDays: !Ref LogRetentionDays

  # Only what the function does: write its own log group, read the HMAC key, enqueue checked events.
  WebhookFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ring-webhook
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WebhookLogGroup.Arn
              - Sid: ReadHmacKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RingHmacSecret
              - Sid: EnqueueEvents
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt WebhookQueue.Arn

  RingWebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile # infra/Makefile packages the app's own webhook code (infra/package_lambda.py)
      ContextPath: .
      ProjectRootDirectory: ..
    Properties:
      Description: Verifies Ring webhook signatures and queues the event (app/store/lambda_webhook.py)
      CodeUri: ..
      Handler: app.store.lambda_webhook.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 4 # Ring expects an answer within 5 seconds
      Role: !GetAtt WebhookFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref WebhookLogGroup
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          HMAC_SECRET_ARN: !Ref RingHmacSecret
          QUEUE_URL: !Ref WebhookQueue
      FunctionUrlConfig:
        AuthType: NONE # Ring can't sign AWS requests; the HMAC over the body is the authentication

  WebhookConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/shopfront/${AWS::StackName}/ring-webhook-consumer"
      RetentionInDays: !Ref LogRetentionDays

  # Only what the consumer does: write its own log group, take messages off the queue, store events.
  WebhookConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ring-webhook-consumer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WebhookConsumerLogGroup.Arn
              - Sid: DrainQueue # what Lambda's SQS event source polls with
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt WebhookQueue.Arn
              - Sid: StoreEvents # TransactWriteItems of two conditional Puts (dedupe on meta.request_id)
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt WebhookTable.Arn

  WebhookConsumerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile # the same package as RingWebhookFunction (infra/package_lambda.py)
      ContextPath: .
      ProjectRootDirectory: ..
    Properties:
      Description: Stores queued Ring webhooks in DynamoDB once per request_id (app/store/lambda_consumer.py)
      CodeUri: ..
      Handler: app.store.lambda_consumer.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt WebhookConsumerRole.Arn
      LoggingConfig:
        LogGroup: !Ref WebhookConsumerLogGroup
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          TABLE_NAME: !Ref WebhookTable
          SHOP_ID: !Ref ShopId
          EVENT_DAYS: !Ref EventDays
          RING_DEVICE_ID: !Ref RingDeviceId
          RING_ACCOUNT_ID: !Ref RingAccountId
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt WebhookQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures] # only the records that failed are retried
            ScalingConfig:
              MaximumConcurrency: 2 # one door's events; the lowest SQS allows

  # ---- The public demo: the app itself over a made-up shop, read-only, for anyone with the link -----------
  # app/public_demo.py: synthetic door events and one signed webhook replay, seeded at cold start the way
  # scripts/demo.py does it; only GET/HEAD reads on an allowlist get through; no Ring, no Bedrock, no writes.
  # It shares nothing with the webhook function: no table, no bucket, no secret, and its role can only log.
  PublicDemoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/shopfront/${AWS::StackName}/public-demo"
      RetentionInDays: !Ref DemoLogRetentionDays

  PublicDemoFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: public-demo-logs-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PublicDemoLogGroup.Arn

  PublicDemoFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile # infra/Makefile -> infra/package_demo.py: the app + its wheels for arm64
      ContextPath: .
      ProjectRootDirectory: ..
    Properties:
      Description: Shopfront public demo, read-only, made-up shop (app/public_demo.py)
      CodeUri: ..
      Handler: app.public_demo.handler # Mangum: Function URL event -> the FastAPI app
      Runtime: python3.12
      Architectures: [arm64]
      # Lambda's CPU grows with memory; 512 MB keeps a cold start (imports, seeding, the story walk:
      # 0.8 s on a laptop) short. Cost stays capped by the reserved concurrency below.
      MemorySize: 512
      Timeout: 10
      ReservedConcurrentExecutions: !If [CapDemoConcurrency, !Ref DemoConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt PublicDemoFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref PublicDemoLogGroup
        LogFormat: JSON
        ApplicationLogLevel: WARN
        SystemLogLevel: WARN
      Environment:
        Variables:
          SHOPFRONT_PUBLIC_DEMO: "1"
          SHOP_TIMEZONE: America/Los_Angeles
      FunctionUrlConfig:
        AuthType: NONE # a public demo; it holds nothing private and refuses every write

  # For the machine that runs the Shopfront app (attach to its IAM user or role): read and replay webhooks
  # in the table, and keep door frames in the bucket. Nothing else.
  ShopfrontAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Shopfront app access to its webhook table and frames bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WebhookTable
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:PutItem
            Resource: !GetAtt WebhookTable.Arn
          - Sid: Frames
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${FramesBucket.Arn}/frames/*"

Outputs:
  WebhookUrl:
    Description: Register this with Ring as the webhook URL (docs/aws.md)
    Value: !Sub "${RingWebhookFunctionUrl.FunctionUrl}webhooks/ring"
  HmacSecretArn:
    Description: Put RING_HMAC_KEY here after deploy
    Value: !Ref RingHmacSecret
  WebhookTableName:
    Description: SHOPFRONT_WEBHOOK_TABLE for the app
    Value: !Ref WebhookTable
  FramesBucketName:
    Description: Private, encrypted bucket for door frames; objects expire after FrameDays
    Value: !Ref FramesBucket
  AppPolicyArn:
    Description: Attach to the IAM user or role the Shopfront app runs as
    Value: !Ref ShopfrontAppPolicy
  LogGroupName:
    Description: The webhook (Function URL) function's logs
    Value: !Ref WebhookLogGroup
  ConsumerLogGroupName:
    Description: The queue consumer's logs (ACCEPTED, DUPLICATE, IGNORED, FAILED per event)
    Value: !Ref WebhookConsumerLogGroup
  QueueUrl:
    Description: The queue between the webhook function and the consumer
    Value: !Ref WebhookQueue
  DeadLetterQueueArn:
    Description: Events the consumer couldn't store after 5 tries; redrive with aws sqs start-message-move-task
    Value: !GetAtt WebhookDeadLetterQueue.Arn
  DemoUrl:
    Description: The public, read-only demo (made-up shop, made-up deliveries); give this link to judges
    Value: !GetAtt PublicDemoFunctionUrl.FunctionUrl
  DemoLogGroupName:
    Description: The public demo's logs
    Value: !Ref PublicDemoLogGroup
