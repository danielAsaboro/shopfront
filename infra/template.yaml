AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Shopfront: a public HTTPS endpoint for Ring's signed webhooks (Lambda Function URL) that checks the HMAC and
  queues the event in SQS, a consumer that stores it in a DynamoDB log the app reads (dead-letter queue after
  5 tries), a private S3 bucket for door frames, the HMAC key in Secrets Manager, an optional
  KMS key that signs dispute packs, and a read-only public demo of the app over a made-up shop (a second
  Function URL). See docs/aws.md.

Parameters:
  ShopId:
    Type: String
    Default: shop
    AllowedPattern: "^[a-z0-9-]{1,40}$"
    Description: >-
      The shop's ID, the partition prefix of its events (pk = ShopId#day). Set SHOPFRONT_SHOP_ID to the same
      value in the app. Ignored when ShopMapParameter names a shop map.
  RingDeviceId:
    Type: String
    Default: ""
    Description: The shop doorbell's Ring device ID (webhook data.attributes.source). Empty accepts any device.
  RingAccountId:
    Type: String
    Default: ""
    Description: The owner's Ring Account ID (webhook meta.account_id). Empty accepts any account.
  ShopMapParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[a-zA-Z0-9_./-]{1,1000}$"
    Description: >-
      Optional, for several shops on one stack. The name (starting with /) of an SSM parameter, String or
      SecureString, holding {"shops": [{"shop_id": ..., "account_id": ..., "device_ids": [...]}]}: which Ring
      account and doorbells are which shop (app/store/shops.py). Empty: the single shop in ShopId,
      RingDeviceId and RingAccountId.
  EventDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: Days a webhook event is kept in DynamoDB before the TTL removes it.
  FrameDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: Days a door frame (a picture of people) is kept in S3 before the lifecycle rule deletes it.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: Days CloudWatch keeps the webhook functions' logs.
  DemoConcurrency:
    Type: Number
    Default: 2
    MinValue: -1
    MaxValue: 10
    Description: >-
      Most public demo requests running at once (reserved concurrency), the cost cap. 0 switches the demo
      off without deleting it. -1 reserves nothing, for accounts whose concurrency limit is too low to
      reserve any (the demo then shares the account's pool, uncapped).
  DemoLogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: Days CloudWatch keeps the public demo's logs.
  AlarmEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+$"
    Description: >-
      Optional. An email address the alarm topic sends to (AWS mails a confirmation link first). Empty: the
      topic has no subscription, and you subscribe whatever you like to the AlarmTopicArn output.
  AppPrincipalArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:(role|user)/[a-zA-Z0-9+=,.@_/-]+$"
    Description: >-
      Optional. The IAM role or user the Shopfront app runs as. When set, the stack makes PackSigningKey, a KMS
      key that only this principal may Sign with (dispute packs, app/pack_signing.py; SHOPFRONT_SIGNING=kms).
  HmacFailureThreshold:
    Type: Number
    Default: 5
    MinValue: 0
    Description: >-
      Webhook requests with a missing or wrong X-Signature in 5 minutes above which the HmacFailures alarm fires
      (a rotated key not yet in the secret, or someone probing the public URL).

Globals:
  Function:
    Tracing: Active # X-Ray on all three functions; the roles get it from TracingPolicy below

Conditions:
  CapDemoConcurrency: !Not [!Equals [!Ref DemoConcurrency, -1]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasShopMap: !Not [!Equals [!Ref ShopMapParameter, ""]]
  HasAppPrincipal: !Not [!Equals [!Ref AppPrincipalArn, ""]]

Resources:
  # The key Ring signs webhooks with (partner onboarding). The template only creates the empty slot; the
  # value is set once after deploy with `aws secretsmanager put-secret-value` (docs/aws.md) and never
  # appears in the template, the parameters or the function's environment. Until then the function
  # answers 503, which Ring retries.
  RingHmacSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shopfront RING_HMAC_KEY for verifying Ring webhook signatures. Set the value after deploy.
      GenerateSecretString:
        SecretStringTemplate: '{"RING_HMAC_KEY": ""}'
        GenerateStringKey: unused
        PasswordLength: 16

  WebhookTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: false # false = encrypted at rest with a DynamoDB-owned key, at no cost

  FramesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-frames
            Status: Enabled
            ExpirationInDays: !Ref FrameDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FramesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FramesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FramesBucket.Arn
              - !Sub "${FramesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---- Ring -> Function URL -> SQS -> consumer -> DynamoDB ----------------------------------------------
  # The Function URL handler only checks and enqueues, so Ring gets its 2xx in milliseconds whatever DynamoDB
  # is doing. A message the consumer can't store is retried; after 5 receives it moves to the dead-letter
  # queue (14 days), where the DlqDepth alarm sees it and `aws sqs start-message-move-task` redrives it.
  WebhookDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600 # 14 days, the most SQS keeps a message

  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600 # 4 days
      VisibilityTimeout: 180 # 6 x the consumer's timeout, as Lambda's SQS event source recommends
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDeadLetterQueue.Arn
        maxReceiveCount: 5

  WebhookQueuesPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WebhookQueue
        - !Ref WebhookDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource:
              - !GetAtt WebhookQueue.Arn
              - !GetAtt WebhookDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/shopfront/${AWS::StackName}/ring-webhook"
      RetentionInDays: !Ref LogRetentionDays

  # Only what the function does: write its own log group, read the HMAC key, enqueue checked events.
  WebhookFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ring-webhook
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WebhookLogGroup.Arn
              - Sid: ReadHmacKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RingHmacSecret
              - Sid: EnqueueEvents
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt WebhookQueue.Arn

  RingWebhookFunction:
    Type: AWS::Serverless::Function
    DependsOn: TracingPolicy # Lambda refuses active tracing until the role may write traces
    Metadata:
      BuildMethod: makefile # infra/Makefile packages the app's own webhook code (infra/package_lambda.py)
      ContextPath: .
      ProjectRootDirectory: ..
    Properties:
      Description: Verifies Ring webhook signatures and queues the event (app/store/lambda_webhook.py)
      CodeUri: ..
      Handler: app.store.lambda_webhook.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 4 # Ring expects an answer within 5 seconds
      Role: !GetAtt WebhookFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref WebhookLogGroup
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          HMAC_SECRET_ARN: !Ref RingHmacSecret
          QUEUE_URL: !Ref WebhookQueue
      FunctionUrlConfig:
        AuthType: NONE # Ring can't sign AWS requests; the HMAC over the body is the authentication

  WebhookConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/shopfront/${AWS::StackName}/ring-webhook-consumer"
      RetentionInDays: !Ref LogRetentionDays

  # Only what the consumer does: write its own log group, take messages off the queue, store events.
  WebhookConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ring-webhook-consumer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WebhookConsumerLogGroup.Arn
              - Sid: DrainQueue # what Lambda's SQS event source polls with
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt WebhookQueue.Arn
              - Sid: StoreEvents # TransactWriteItems of two conditional Puts (dedupe on meta.request_id)
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt WebhookTable.Arn

  # Several shops: the consumer may read the one SSM parameter that maps Ring accounts and doorbells to shops.
  # A SecureString under the AWS managed key aws/ssm needs no KMS grant here: that key's policy lets the
  # account's principals decrypt through SSM. Under a customer managed key, add kms:Decrypt on that key.
  ShopMapReadPolicy:
    Type: AWS::IAM::Policy
    Condition: HasShopMap
    Properties:
      PolicyName: read-shop-map
      Roles: [!Ref WebhookConsumerRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadShopMap
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ShopMapParameter}"

  WebhookConsumerFunction:
    Type: AWS::Serverless::Function
    DependsOn: TracingPolicy # Lambda refuses active tracing until the role may write traces
    Metadata:
      BuildMethod: makefile # the same package as RingWebhookFunction (infra/package_lambda.py)
      ContextPath: .
      ProjectRootDirectory: ..
    Properties:
      Description: Stores queued Ring webhooks in DynamoDB once per request_id (app/store/lambda_consumer.py)
      CodeUri: ..
      Handler: app.store.lambda_consumer.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt WebhookConsumerRole.Arn
      LoggingConfig:
        LogGroup: !Ref WebhookConsumerLogGroup
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          TABLE_NAME: !Ref WebhookTable
          SHOP_ID: !Ref ShopId
          EVENT_DAYS: !Ref EventDays
          RING_DEVICE_ID: !Ref RingDeviceId
          RING_ACCOUNT_ID: !Ref RingAccountId
          SHOP_MAP_PARAMETER: !Ref ShopMapParameter
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt WebhookQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures] # only the records that failed are retried
            ScalingConfig:
              MaximumConcurrency: 2 # one door's events; the lowest SQS allows

  # ---- The public demo: the app itself over a made-up shop, read-only, for anyone with the link -----------
  # app/public_demo.py: synthetic door events and one signed webhook replay, seeded at cold start the way
  # scripts/demo.py does it; only GET/HEAD reads on an allowlist get through; no Ring, no Bedrock, no writes.
  # It shares nothing with the webhook functions: no table, no bucket, no secret, and its role can only log
  # (and write X-Ray traces, through TracingPolicy).
  PublicDemoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/shopfront/${AWS::StackName}/public-demo"
      RetentionInDays: !Ref DemoLogRetentionDays

  PublicDemoFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: public-demo-logs-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PublicDemoLogGroup.Arn

  PublicDemoFunction:
    Type: AWS::Serverless::Function
    DependsOn: TracingPolicy # Lambda refuses active tracing until the role may write traces
    Metadata:
      BuildMethod: makefile # infra/Makefile -> infra/package_demo.py: the app + its wheels for arm64
      ContextPath: .
      ProjectRootDirectory: ..
    Properties:
      Description: Shopfront public demo, read-only, made-up shop (app/public_demo.py)
      CodeUri: ..
      Handler: app.public_demo.handler # Mangum: Function URL event -> the FastAPI app
      Runtime: python3.12
      Architectures: [arm64]
      # Lambda's CPU grows with memory; 512 MB keeps a cold start (imports, seeding, the story walk:
      # 0.8 s on a laptop) short. Cost stays capped by the reserved concurrency below.
      MemorySize: 512
      Timeout: 10
      ReservedConcurrentExecutions: !If [CapDemoConcurrency, !Ref DemoConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt PublicDemoFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref PublicDemoLogGroup
        LogFormat: JSON
        ApplicationLogLevel: WARN
        SystemLogLevel: WARN
      Environment:
        Variables:
          SHOPFRONT_PUBLIC_DEMO: "1"
          SHOP_TIMEZONE: America/Los_Angeles
      FunctionUrlConfig:
        AuthType: NONE # a public demo; it holds nothing private and refuses every write

  # X-Ray for the three functions. PutTraceSegments and PutTelemetryRecords take no resource-level
  # permissions, so this is the one "*" in the stack; a separate policy keeps each role's own list readable.
  # The consumer's segment joins the webhook request's trace through the message's AWSTraceHeader, which
  # the Function URL handler sets from _X_AMZN_TRACE_ID (app/store/lambda_webhook.py).
  TracingPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: xray-write
      Roles:
        - !Ref WebhookFunctionRole
        - !Ref WebhookConsumerRole
        - !Ref PublicDemoFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WriteTraces
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"

  # ---- Alarms: one SNS topic, an optional email subscription ---------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Shopfront alarms

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarmsOfThisAccount
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # The Function URL handler logs one JSON line per request; a wrong or missing signature is logged with the
  # status BAD_SIGNATURE (and nothing else it logs contains that term).
  HmacFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebhookLogGroup
      FilterPattern: '"BAD_SIGNATURE"'
      MetricTransformations:
        - MetricNamespace: !Sub "Shopfront/${AWS::StackName}"
          MetricName: HmacFailures
          MetricValue: "1"
          Unit: Count

  # The consumer logs a record it couldn't store at level ERROR (Lambda's JSON log format puts it in $.level).
  ConsumerFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebhookConsumerLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: !Sub "Shopfront/${AWS::StackName}"
          MetricName: ConsumerFailedRecords
          MetricValue: "1"
          Unit: Count

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ring events the consumer couldn't store after 5 tries are waiting in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WebhookDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  HmacFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Webhook requests with a missing or wrong HMAC signature (key rotated, or the URL probed)
      Namespace: !Sub "Shopfront/${AWS::StackName}"
      MetricName: HmacFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref HmacFailureThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Either kind of consumer failure: the function itself erring, or a record it reported back as failed.
  ConsumerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The webhook queue consumer failed (function errors or records it couldn't store)
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref WebhookConsumerFunction
            Period: 300
            Stat: Sum
        - Id: failed
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Sub "Shopfront/${AWS::StackName}"
              MetricName: ConsumerFailedRecords
            Period: 300
            Stat: Sum
        - Id: total
          Expression: FILL(errors, 0) + FILL(failed, 0)
          Label: Consumer errors and failed records
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The public Function URL erring means Ring gets a 5xx and retries; it should never happen.
  WebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The webhook Function URL handler failed (Ring gets a 5xx and retries)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RingWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The demo's reserved concurrency is its cost cap, so throttles are expected in a burst; a steady stream
  # means someone is hammering the link (or DemoConcurrency is 0 and people are still visiting).
  DemoThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The public demo is turning visitors away (throttled at its reserved concurrency)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref PublicDemoFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # ---- Dispute pack signing: an asymmetric KMS key the app signs with and nobody else can ----------------
  # ECC_NIST_P256 with ECDSA_SHA_256 (JOSE ES256): the private key never leaves KMS; the app publishes the public
  # key at /.well-known/shopfront-pack-key and scripts/verify_pack.py checks a pack offline. The account keeps
  # administration (so the key can't be orphaned) but not Sign or CreateGrant, and an explicit Deny refuses Sign
  # to every principal but AppPrincipalArn, whatever an IAM policy or a grant says. Asymmetric keys don't
  # rotate automatically; to rotate, deploy a new key and keep the old public key for packs it signed.
  PackSigningKey:
    Type: AWS::KMS::Key
    Condition: HasAppPrincipal
    Properties:
      Description: Shopfront dispute pack signing key (ECDSA P-256); only the app principal may Sign
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministersButDoesNotSign
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetPublicKey
              - kms:GetKeyRotationStatus
              - kms:ListGrants
              - kms:ListKeyPolicies
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:UpdateKeyDescription
              - kms:EnableKey
              - kms:DisableKey
              - kms:RevokeGrant
              - kms:RetireGrant
              - kms:TagResource
              - kms:UntagResource
              - kms:CreateAlias
              - kms:UpdateAlias
              - kms:DeleteAlias
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
          - Sid: OnlyTheAppSigns
            Effect: Allow
            Principal:
              AWS: !Ref AppPrincipalArn
            Action:
              - kms:Sign
              - kms:GetPublicKey
              - kms:DescribeKey
            Resource: "*"
          - Sid: NobodyElseSigns
            Effect: Deny
            Principal: "*"
            Action: kms:Sign
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:PrincipalArn: !Ref AppPrincipalArn

  PackSigningKeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasAppPrincipal
    Properties:
      AliasName: !Sub "alias/shopfront-${AWS::StackName}-pack-signing"
      TargetKeyId: !Ref PackSigningKey

  # For the machine that runs the Shopfront app (attach to its IAM user or role): read and replay webhooks
  # in the table, and keep door frames in the bucket. Nothing else.
  ShopfrontAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Shopfront app access to its webhook table and frames bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WebhookTable
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:PutItem
            Resource: !GetAtt WebhookTable.Arn
          - Sid: Frames
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${FramesBucket.Arn}/frames/*"

Outputs:
  WebhookUrl:
    Description: Register this with Ring as the webhook URL (docs/aws.md)
    Value: !Sub "${RingWebhookFunctionUrl.FunctionUrl}webhooks/ring"
  HmacSecretArn:
    Description: Put RING_HMAC_KEY here after deploy
    Value: !Ref RingHmacSecret
  WebhookTableName:
    Description: SHOPFRONT_WEBHOOK_TABLE for the app
    Value: !Ref WebhookTable
  FramesBucketName:
    Description: Private, encrypted bucket for door frames; objects expire after FrameDays
    Value: !Ref FramesBucket
  AppPolicyArn:
    Description: Attach to the IAM user or role the Shopfront app runs as
    Value: !Ref ShopfrontAppPolicy
  LogGroupName:
    Description: The webhook (Function URL) function's logs
    Value: !Ref WebhookLogGroup
  ConsumerLogGroupName:
    Description: The queue consumer's logs (ACCEPTED, DUPLICATE, IGNORED, FAILED per event)
    Value: !Ref WebhookConsumerLogGroup
  QueueUrl:
    Description: The queue between the webhook function and the consumer
    Value: !Ref WebhookQueue
  DeadLetterQueueArn:
    Description: Events the consumer couldn't store after 5 tries; redrive with aws sqs start-message-move-task
    Value: !GetAtt WebhookDeadLetterQueue.Arn
  DemoUrl:
    Description: The public, read-only demo (made-up shop, made-up deliveries); give this link to judges
    Value: !GetAtt PublicDemoFunctionUrl.FunctionUrl
  DemoLogGroupName:
    Description: The public demo's logs
    Value: !Ref PublicDemoLogGroup
  AlarmTopicArn:
    Description: SNS topic every alarm notifies; subscribe email, chat or a pager to it
    Value: !Ref AlarmTopic
  PackSigningKeyArn:
    Condition: HasAppPrincipal
    Description: SHOPFRONT_SIGNING_KEY_ARN for the app (with SHOPFRONT_SIGNING=kms); only AppPrincipalArn may Sign
    Value: !GetAtt PackSigningKey.Arn
