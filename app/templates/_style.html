<style>
  /* Tokens: see design.md. --edge is the border of anything you can type in or press (>= 3:1 on --bg). */
  :root { color-scheme: light dark;
          --bg:#f7f6f3; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dd; --edge:#8a8780;
          --today:#2f6fdb; --lw:#c9c7c1; --warn:#a14a14; --warn-bg:#fbefe4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --ink:#ececee; --muted:#9a9aa1; --line:#2e2e33; --edge:#6a6a72;
            --today:#6b9cf0; --lw:#4a4a50; --warn:#e48a52; --warn-bg:#3a2516; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 48px; }
  /* Blue means today's data, never a link: links are ink, underlined */
  a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted);
      text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Site header: the same on every page */
  .site { display:flex; flex-wrap:wrap; gap:4px 20px; align-items:baseline; justify-content:space-between;
          border-bottom:1px solid var(--line); padding-bottom: 6px; margin-bottom: 20px; }
  .site .brand { font-weight:600; text-decoration:none; padding: 8px 0; }
  .site .brand span { font-weight:400; color: var(--muted); }
  .site nav { display:flex; flex-wrap:wrap; gap: 0 18px; font-size: 14px; }
  .site nav a { padding: 8px 0; text-decoration: none; color: var(--muted); }
  .site nav a:hover { color: var(--ink); }
  .site nav a[aria-current=page] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--ink); }

  .page-head { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:space-between; }
  .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  h1 { font-size: 28px; line-height: 1.2; margin: 2px 0 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display:inline; }

  /* Form controls: one look everywhere, borders you can see, 16px text so iOS doesn't zoom on focus */
  input, select, textarea { font: inherit; font-size: 16px; padding: 7px 10px; border:1px solid var(--edge);
                            border-radius:6px; background: var(--bg); color: var(--ink); min-width: 0; }
  input:not([type=checkbox]):not([type=file]), select { height: 40px; }
  input[type=checkbox] { width: 18px; height: 18px; padding: 0; accent-color: var(--ink); }
  input[type=file] { padding: 6px; }
  ::placeholder { color: var(--muted); opacity: 1; }
  button, .primary, .secondary { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 6px; cursor: pointer;
                                 white-space: nowrap; display: inline-block; text-decoration: none; line-height: 1.4; }
  button, .primary { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
  button.secondary, .secondary { border: 1px solid var(--edge); background: transparent; color: var(--ink); }
  .frame-del { margin: 2px 0 0; font-size: 12px; }
  button.quiet { border: 0; padding: 0; background: none; color: var(--muted); text-decoration: underline; font-size: inherit; }
  button:disabled { opacity: .4; cursor: default; }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .field > input, .field > select { color: var(--ink); }
  .fields { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .fields > .grow { flex: 1 1 180px; } .fields > .fit { flex: 0 0 auto; }
  .fields > button, .fields > .btn { flex: none; }

  /* Banner: the source of truth (demo data, replays, Ring down). One sentence, warn colours, prints too. */
  .banner { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .warn-bg { background: var(--warn-bg); color: var(--warn); }
  .banner a { color: inherit; font-weight: 600; text-decoration-color: currentColor; }
  .note { border: 1px solid var(--line); }
  .note.ok { border-left: 3px solid var(--ink); }

  .value { margin: 6px 0 0; font-size: 17px; line-height: 1.35; }
  .tap a.claim-link { color: var(--muted); }
  /* Source badge: one word for what a label rests on; the sentence opens under it */
  details.src { display: inline-block; vertical-align: baseline; }
  details.src > summary { list-style: none; display: inline; }
  details.src > summary::-webkit-details-marker { display: none; }
  details.src[open] { display: block; }
  details.src > .why { display: block; margin-top: 4px; }
  .badge { display: inline-block; font-size: 11px; line-height: 1.5; letter-spacing: .04em; text-transform: uppercase;
           padding: 0 6px; border: 1px solid var(--edge); border-radius: 999px; color: var(--muted); }
  .badge.b-demo, .badge.b-replay { border-style: dashed; }
  .receipts td.src-cell { width: 76px; white-space: nowrap; }
  .receipts td.src-cell details[open] { white-space: normal; width: 220px; }
  .lead { margin: 20px 0 8px; }
  .lead .first { font-size: 22px; line-height: 1.35; margin: 0 0 8px; font-weight: 600; }
  .lead .reason { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .lead ul { margin: 0; padding-left: 18px; color: var(--ink); }
  .lead li { margin: 4px 0; }
  /* A checked scan's answer: one block, ruled on the left (warn when the owner should act), with its next step */
  .verdict { margin: 20px 0 8px; padding: 2px 0 2px 14px; border-left: 3px solid var(--line); }
  .verdict.act { border-left-color: var(--warn); }
  .verdict .first { font-size: 22px; line-height: 1.35; margin: 4px 0 6px; font-weight: 600; }
  .verdict .reason { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .verdict .next { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 12px 0 0; }
  .verdict .next .primary { margin: 0; }
  .verdict .thumb img { width: 160px; }
  .verdict form.keep { display: inline-flex; gap: 8px; align-items: center; margin: 0; }
  .try-demo { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 16px 0 0; }
  .try-demo button { margin: 0; }
  .record ul { margin: 6px 0 0; padding-left: 18px; }
  .record li { margin: 4px 0; }
  .record details.kept { margin: 2px 0 0; }
  .record details.kept ul { padding-left: 16px; }
  .record form.keep { display: inline; margin: 0; }
  details.scan-check > summary { list-style: none; }
  details.scan-check > summary::-webkit-details-marker { display: none; }
  details.scan-check:not([open]) > summary h2::after { content: " ›"; }
  .figures { display:grid; grid-template-columns: repeat(3, 1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin: 24px 0; }
  .figures div { padding: 14px 0; }
  .figures div + div { padding-left: 16px; border-left: 1px solid var(--line); }
  .figures .v { display:block; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .figures .l { color: var(--muted); font-size: 12px; }
  .figures .v small { font-size: 14px; font-weight: 500; }
  .warn { color: var(--warn); }
  .muted, .why { color: var(--muted); }
  .block { margin-top: 28px; }
  details summary { cursor: pointer; list-style-position: inside; }
  .chart { display:flex; align-items:flex-end; gap:3px; height:150px; margin-top:12px; }
  .col { flex:1; display:flex; align-items:flex-end; gap:1px; height:100%; }
  .bar { flex:1; border-radius:2px 2px 0 0; min-height:1px; }
  .bar.t { background: var(--today); } .bar.w { background: var(--lw); }
  .axis { display:flex; gap:3px; color:var(--muted); font-size:10px; margin-top:4px; }
  .axis span { flex:1; text-align:center; }
  .legend { font-size:12px; color:var(--muted); margin-left: 8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:-1px; }
  table { width:100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  td, th { text-align:left; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.t { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .why { font-size: 13px; }
  th.why { font-size: 12px; }
  .proof { margin-top: 32px; color: var(--muted); font-size: 12px; }
  .proof a { color: inherit; }
  .tech { margin-top: 6px; }
  .tech summary { color: var(--muted); font-size: 12px; padding: 4px 0; }
  .tech[open] summary { margin-bottom: 4px; }
  .steps { padding-left: 18px; } .steps li { margin: 6px 0; }
  .money { margin: 14px 0 0; font-size: 15px; }
  .first-run { margin: 20px 0 8px; }
  .first-run .first { font-size: 22px; line-height: 1.3; margin: 0 0 6px; font-weight: 600; }
  .first-run .reason { color: var(--muted); margin: 0 0 14px; }
  .first-run .next { margin: 0; padding-left: 20px; display: grid; gap: 12px; }
  .first-run .next .primary { margin: 0 8px 0 0; }
  .first-run .next .why { display: inline-block; }
  .receipts td.thumb { width: 88px; padding-right: 0; }
  .receipts td.thumb:empty { width: 0; padding: 0; }
  .receipts td.why:not(.src-cell) { width: 30%; }
  .receipts img, .ask img.frame { display:block; width: 72px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; }
  .ask img.frame { width: 240px; max-width: 100%; margin: 8px 0; }
  .row-ask { display:flex; gap:8px; margin-top: 10px; }
  .row-ask input { flex: 1 1 auto; }
  .ask .said { font-size: 17px; margin: 12px 0 4px; }
  .ask-example { margin: 12px 0 0; padding: 10px 0 10px 14px; border-left: 2px dashed var(--edge); }
  .ask-example .q { margin: 4px 0; font-weight: 600; }
  .ask-example .a { margin: 0 0 4px; }
  .tap { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-top:6px; font-size:13px; }
  .tapform { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0; }
  .tapform button { font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--edge);
                    background: transparent; color: var(--ink); }
  .tapform button.quiet { border: 0; padding: 0; }
  .tapform input { font-size: 16px; padding: 3px 8px; width: 170px; height: 32px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space: nowrap; }
  .primary { margin-top: 8px; }
  /* The door around a scan (_strip.html): neutral marks by what they rest on, the scan tick in ink */
  .strip { margin: 14px 0 0; }
  .strip-row { display: flex; gap: 14px; align-items: flex-start; }
  .strip-svg { flex: 1 1 auto; min-width: 0; overflow: visible; display: block; }
  .strip-svg text { font: 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .s-band { fill: var(--line); }
  .s-near { fill: none; stroke: var(--edge); stroke-dasharray: 3 3; }
  .s-axis { stroke: var(--edge); }
  .s-win { fill: var(--lw); }
  .s-lab, .s-tick { fill: var(--muted); }
  .s-tick { font-variant-numeric: tabular-nums; }
  .s-scan { stroke: var(--ink); stroke-width: 2; }
  .s-scanlab { fill: var(--ink); font-weight: 600; }
  .s-dot { stroke-width: 1.5; }
  .s-courier { fill: var(--ink); stroke: var(--bg); }
  .s-person { fill: var(--muted); stroke: var(--muted); }
  .s-seen { fill: var(--ink); stroke: var(--ink); fill-opacity: .55; }
  .s-guess { fill: var(--bg); stroke: var(--muted); }
  .strip-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .strip-key span { display: inline-flex; gap: 5px; align-items: center; }
  .strip-frame img { display: block; width: 120px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; }
  .strip-words { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); margin: 0; }
  /* The verdict's facts: a tick or a cross, then a few words */
  ul.facts3 { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 15px; }
  ul.facts3 li { display: flex; margin: 0; gap: 8px; align-items: baseline; }
  .facts3 .mk { flex: none; width: 1.1em; text-align: center; font-weight: 700; }
  .facts3 .no .mk { color: var(--muted); }
  .verdict-src { margin: 8px 0 0; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 560px) {
    .strip-row { flex-direction: column; gap: 8px; }
    .axis span:nth-child(odd) { visibility:hidden; }
    .figures div + div { padding-left: 10px; }
    .figures .v { font-size: 22px; }
    td.why, th.why { display: none; }
    .fields > .grow { flex-basis: 100%; }
    /* "How we know" stays on phones: each row stacks it under the row instead of dropping the column */
    .receipts tr, .log tr { display: grid; column-gap: 10px; border-bottom: 1px solid var(--line); padding: 8px 0; }
    .receipts tr { grid-template-columns: 46px 1fr auto; }
    .receipts td.t { white-space: normal; }
    .log tr { grid-template-columns: auto auto 1fr; }
    .receipts td, .log td { border-bottom: 0; padding: 0; }
    .receipts td.thumb { grid-column: 3; grid-row: 1; width: auto; }
    .receipts td.why, .log td.why { display: block; grid-column: 1 / -1; grid-row: 2; padding-top: 4px; width: auto; }
    .receipts td.why { grid-column: 2 / -1; }
    .receipts td.src-cell details[open] { width: auto; }
    .receipts td.why:empty { display: none; }
    .log tr:first-child { display: none; }
  }
  @media print {
    .site nav, .no-print { display: none; }
    body { background: #fff; color: #000; }
    .banner { border: 1px solid currentColor; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td.why, th.why { display: table-cell; }
    .strip-svg, .strip-key svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .strip-words { position: static; width: auto; height: auto; overflow: visible; clip: auto; font-size: 12px; margin: 4px 0 0; }
  }
</style>
